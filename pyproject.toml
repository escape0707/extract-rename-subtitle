[project]
name = "sub-utils"
version = "0.1.0"
description = "CLI utilities to extract and rename subtitle files for video collections."
readme = "README.md"
authors = [
    { name = "escape0707", email = "tothesong@gmail.com" }
]
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.14"
dependencies = []

[project.scripts]
sub-utils = "sub_utils.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.37.3",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: tests that require ffmpeg/ffprobe",
]

[tool.ruff]
line-length = 100
